<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #0A0A0A; border: 1px solid var(--border); padding: 22px; transition: border-color 400ms cubic-bezier(.4,0,.2,1); }
  .card.hover { border-color: var(--accent); }
  .eb { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); display:inline-flex; align-items:center; gap: 10px; }
  .eb::before { content:""; display:inline-block; width: 20px; height: 1px; background: var(--accent); }
  h3 { font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1.05; letter-spacing: -.04em; text-transform: uppercase; color: #fff; margin: 14px 0 10px; }
  p { font-family: var(--font-body); font-size: 13px; line-height: 1.5; color: #E6E6E6; margin: 0 0 16px; }
  .meta { font-family: var(--font-body); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: #DDC17C; }
</style></head>
<body>
  <div class="card">
    <span class="eb">Custom Build</span>
    <h3>Birchwood Residence</h3>
    <p>5,200 sq ft. Single-family. Wood Buffalo, AB.</p>
    <span class="meta">2024 · Completed</span>
  </div>
  <div class="card hover">
    <span class="eb">Restoration</span>
    <h3>Highway 63 Reconstruction</h3>
    <p>Post-flood structural rebuild and finishing.</p>
    <span class="meta">2021 · Completed</span>
  </div>
</body></html>
