<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .swatch { display: flex; flex-direction: column; gap: 10px; }
  .chip { aspect-ratio: 4/1; border-radius: 0; border: 1px solid var(--border); }
  .chip.lite { border: 1px solid #d4d4d4; }
  .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .meta .name { font-family: var(--font-display); font-weight: 900; font-size: 18px; letter-spacing: -.03em; text-transform: uppercase; color: var(--fg); }
  .meta .hex { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="swatch">
      <div class="chip" style="background:#000000"></div>
      <div class="meta"><span class="name">Black</span><span class="hex">#000000</span></div>
    </div>
    <div class="swatch">
      <div class="chip lite" style="background:#FFFFFF"></div>
      <div class="meta"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#CEA64D"></div>
      <div class="meta"><span class="name">Gold</span><span class="hex">#CEA64D</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#DDC17C"></div>
      <div class="meta"><span class="name">Light Gold</span><span class="hex">#DDC17C</span></div>
    </div>
  </div>
</body></html>
