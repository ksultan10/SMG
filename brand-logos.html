<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
  .frame { background: #0a0a0a; padding: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
  .frame img { max-width: 100%; max-height: 110px; object-fit: contain; }
  .lbl { font-family: var(--font-body); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-subtle); margin-top: 10px; font-weight: 600; text-align: center; }
  .lbl b { color: var(--accent); margin-right: 6px; }
  .col { display: flex; flex-direction: column; }
</style></head>
<body>
  <div class="col">
    <div class="frame"><img src="../assets/logo-horizontal.png" alt="SMG horizontal" /></div>
    <div class="lbl"><b>Horizontal</b>nav, footer, header</div>
  </div>
  <div class="col">
    <div class="frame"><img src="../assets/logo-stacked.png" alt="SMG stacked" /></div>
    <div class="lbl"><b>Stacked</b>square placements</div>
  </div>
</body></html>
