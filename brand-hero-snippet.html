<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--bg); }
  .hero { aspect-ratio: 16/6; position: relative; overflow: hidden; background: linear-gradient(135deg, #1a1a1a, #000); display: flex; align-items: end; padding: 28px 32px; }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 20%, rgba(206,166,77,.18), transparent 50%), radial-gradient(ellipse at 20% 100%, rgba(206,166,77,.06), transparent 60%); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.85) 100%); }
  .copy { position: relative; z-index: 1; }
  .eb { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); display: inline-flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .eb::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
  h1 { font-family: var(--font-display); font-weight: 900; font-size: 56px; line-height: .92; letter-spacing: -.05em; text-transform: uppercase; color: #fff; margin: 0; }
  h1 .gold { color: var(--accent); }
</style></head>
<body>
  <div class="hero">
    <div class="copy">
      <span class="eb">Est. 2013 — Fort McMurray</span>
      <h1>We build<br>what <span class="gold">lasts</span>.</h1>
    </div>
  </div>
</body></html>
