<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg); }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .group { display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 12px; line-height: 1; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); display: inline-flex; align-items: center; gap: 12px; }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
  .role { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-soft); }
  .meta { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; color: var(--fg-subtle); }
</style></head>
<body>
  <div class="stack">
    <div class="group">
      <span class="eyebrow">Est. 2013 — Fort McMurray</span>
      <span class="meta">.smg-eyebrow · 12px / 0.2em / gold + 24px rule</span>
    </div>
    <div class="group">
      <span class="role">Project Lead — Restoration</span>
      <span class="meta">.smg-role · 13px / 0.2em / light gold</span>
    </div>
  </div>
</body></html>
