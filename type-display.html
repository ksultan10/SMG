<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); }
  .specimen { font-family: var(--font-display); font-weight: 900; font-size: 124px; line-height: .9; letter-spacing: -.05em; color: var(--fg); text-transform: uppercase; }
  .specimen .gold { color: var(--accent); }
  .meta { display: flex; gap: 28px; margin-top: 18px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--fg-subtle); }
  .meta b { color: var(--fg); font-family: var(--font-body); letter-spacing: .15em; text-transform: uppercase; font-weight: 700; margin-right: 6px; }
</style></head>
<body>
  <div class="specimen">BUILD<br>WHAT <span class="gold">LASTS</span>.</div>
  <div class="meta">
    <span><b>Face</b>Inter Black · 900</span>
    <span><b>Track</b>−0.05em</span>
    <span><b>Lead</b>0.9</span>
  </div>
</body></html>
