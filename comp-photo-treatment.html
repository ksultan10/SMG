<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .photo { aspect-ratio: 4/3; background: linear-gradient(135deg, #2a2a2a, #0a0a0a); position: relative; overflow: hidden; }
  .photo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 80%, rgba(206,166,77,.12), transparent 60%); }
  .photo.gray { filter: grayscale(1) contrast(1.05); }
  .photo.color { filter: none; }
  .lbl { font-family: var(--font-body); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-subtle); margin-top: 8px; font-weight: 600; }
  .lbl b { color: var(--accent); margin-right: 6px; }
  .col { display: flex; flex-direction: column; }
  .h { width: 100%; font-family: var(--font-body); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 600; grid-column: 1 / -1; }
  /* simulated photo content */
  .p1 { background: linear-gradient(160deg, #4a3a1a 0%, #2a2010 50%, #0a0a0a 100%); }
  .p2 { background: linear-gradient(140deg, #5a4a30 0%, #2a200f 60%, #000 100%); }
</style></head>
<body>
  <span class="h">Photography treatment — grayscale → color reveal</span>
  <div class="col"><div class="photo gray p1"></div><div class="lbl"><b>Default</b>grayscale(1)</div></div>
  <div class="col"><div class="photo color p1"></div><div class="lbl"><b>Hover</b>full color · 900ms</div></div>
  <div class="col"><div class="photo gray p2"></div><div class="lbl"><b>Default</b>grayscale(1)</div></div>
</body></html>
