<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #E6E6E6; background: transparent; }
  .tag.gold { border-color: var(--accent); color: var(--accent); }
  .tag.solid { background: var(--accent); color: #000; border-color: var(--accent); }
  .tag .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .lbl { width:100%; font-family: var(--font-body); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; font-weight: 600; }
</style></head>
<body>
  <span class="lbl">Tag chips · status pills</span>
  <span class="tag">Custom Build</span>
  <span class="tag gold"><span class="dot"></span>In progress</span>
  <span class="tag">Commercial</span>
  <span class="tag solid">Featured</span>
  <span class="tag gold">2024</span>
  <span class="tag">Edmonton</span>
</body></html>
