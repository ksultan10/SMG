<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); display: flex; gap: 28px; align-items: center; }
  .sample { width: 96px; height: 96px; background: var(--bg-elevated); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--accent); letter-spacing: .15em; text-transform: uppercase; }
  .r0 { border-radius: 0; } .r1 { border-radius: 2px; } .r2 { border-radius: 4px; } .rp { border-radius: 999px; padding: 0 18px; width: auto; height: 36px; }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-subtle); margin-top: 8px; text-align: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
  h4 { font-family: var(--font-body); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin: 0; font-weight: 600; }
</style></head>
<body>
  <div class="col"><h4 style="margin-bottom:14px;">Radii</h4></div>
  <div class="col"><div class="sample r0">0px</div><div class="meta">--radius-0<br/>default</div></div>
  <div class="col"><div class="sample r1">2px</div><div class="meta">--radius-1<br/>inputs</div></div>
  <div class="col"><div class="sample r2">4px</div><div class="meta">--radius-2<br/>max</div></div>
  <div class="col"><div class="sample rp">PILL</div><div class="meta">tags only</div></div>
</body></html>
