<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 0; border-bottom: 1px solid var(--border); }
  td:last-child { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .tk { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--accent); width: 36%; }
  .desc { font-family: var(--font-body); font-size: 12.5px; color: var(--fg-muted); }
  .dur { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-subtle); }
</style></head>
<body>
  <table>
    <tr><td class="tk">--ease-premium</td><td class="desc">cubic-bezier(0.4, 0, 0.2, 1)</td><td class="dur">default</td></tr>
    <tr><td class="tk">--ease-out</td><td class="desc">cubic-bezier(0.16, 1, 0.3, 1)</td><td class="dur">entrances</td></tr>
    <tr><td class="tk">--dur-fast</td><td class="desc">200ms — micro</td><td class="dur">200ms</td></tr>
    <tr><td class="tk">--dur-base</td><td class="desc">400ms — standard transitions</td><td class="dur">400ms</td></tr>
    <tr><td class="tk">--dur-slow</td><td class="desc">600ms — section reveals</td><td class="dur">600ms</td></tr>
    <tr><td class="tk">--dur-glacial</td><td class="desc">900ms — photo color reveal</td><td class="dur">900ms</td></tr>
  </table>
</body></html>
