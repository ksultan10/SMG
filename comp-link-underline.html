<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg); display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  a { font-family: var(--font-body); font-weight: 500; font-size: 18px; color: #fff; text-decoration: none; padding-bottom: 2px; background-image: linear-gradient(var(--accent), var(--accent)); background-repeat: no-repeat; background-position: 0 100%; transition: background-size 400ms cubic-bezier(.4,0,.2,1), color 400ms; }
  a.idle { background-size: 0% 2px; }
  a.hover { background-size: 100% 2px; color: var(--accent); }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-subtle); margin-left: auto; }
</style></head>
<body>
  <div class="row"><a class="idle" href="#">View the Birchwood Residence</a><span class="meta">default</span></div>
  <div class="row"><a class="hover" href="#">View the Birchwood Residence</a><span class="meta">hover · gold underline grows L→R</span></div>
</body></html>
