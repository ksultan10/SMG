<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--bg); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  td:last-child { border-bottom: 0; }
  tr:last-child td { border-bottom: 0; }
  .tk { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--fg); width: 22%; }
  .px { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-subtle); width: 14%; }
  .bar div { height: 14px; background: var(--accent); }
</style></head>
<body>
  <table>
    <tr><td class="tk">--space-1</td><td class="px">4px</td><td class="bar"><div style="width:4px"></div></td></tr>
    <tr><td class="tk">--space-2</td><td class="px">8px</td><td class="bar"><div style="width:8px"></div></td></tr>
    <tr><td class="tk">--space-3</td><td class="px">12px</td><td class="bar"><div style="width:12px"></div></td></tr>
    <tr><td class="tk">--space-4</td><td class="px">16px</td><td class="bar"><div style="width:16px"></div></td></tr>
    <tr><td class="tk">--space-5</td><td class="px">24px</td><td class="bar"><div style="width:24px"></div></td></tr>
    <tr><td class="tk">--space-6</td><td class="px">32px</td><td class="bar"><div style="width:32px"></div></td></tr>
    <tr><td class="tk">--space-7</td><td class="px">48px</td><td class="bar"><div style="width:48px"></div></td></tr>
    <tr><td class="tk">--space-8</td><td class="px">64px</td><td class="bar"><div style="width:64px"></div></td></tr>
    <tr><td class="tk">--space-9</td><td class="px">96px</td><td class="bar"><div style="width:96px"></div></td></tr>
    <tr><td class="tk">--space-10</td><td class="px">128px</td><td class="bar"><div style="width:128px"></div></td></tr>
    <tr><td class="tk">--space-11</td><td class="px">160px</td><td class="bar"><div style="width:160px"></div></td></tr>
  </table>
</body></html>
