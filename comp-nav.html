<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); display: flex; flex-direction: column; gap: 20px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .brand { font-family: var(--font-display); font-weight: 900; font-size: 18px; letter-spacing: -.03em; text-transform: uppercase; color: #fff; display:flex; align-items:center; gap: 10px; }
  .brand .mark { width: 22px; height: 22px; border-radius: 999px; background: var(--accent); }
  .links { display: flex; gap: 28px; }
  .links a { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #fff; text-decoration: none; padding-bottom: 4px; position: relative; }
  .links a.active::after, .links a:hover::after { content:""; position: absolute; left:0; right:0; bottom:0; height: 2px; background: var(--accent); }
  .cta { font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; padding: 12px 18px; background: var(--accent); color: #000; text-decoration: none; }
</style></head>
<body>
  <nav>
    <span class="brand"><span class="mark"></span>SMG · BUILDERS</span>
    <div class="links">
      <a href="#" class="active">Home</a>
      <a href="#">About</a>
      <a href="#">Portfolio</a>
      <a href="#">Sponsorships</a>
      <a href="#">Contact</a>
    </div>
    <a href="#" class="cta">Get estimate →</a>
  </nav>
</body></html>
